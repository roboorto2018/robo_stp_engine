[package]
name = "robo_stp_engine"
version = "0.1.0"
edition = "2021"
description = "Motore di robo importer: legge STEP e IGES con OpenCascade e restituisce i triangoli"
license = "LGPL-2.1-only WITH OCCT-exception-1.0"

[dependencies]
anyhow = "1"
cfb = "0.15.0"
flate2 = "1.1.10"

[build-dependencies]
cc = "1"

[[bin]]
name = "robo_stp_engine"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "robo_stp_engine_silent"
path = "src/bin/robo_stp_engine_silent.rs"
